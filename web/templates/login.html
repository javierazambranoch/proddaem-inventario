<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProDaem - Iniciar Sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body class="login-body">
    <div class="login-container">
        <img class="login-logo" src="https://daemnacimiento.cl/wp-content/uploads/2024/10/logo_web_2.png" alt="Logo DAEM">
        <h1>ProDaem</h1>
        <p>Sistema de Inventario DAEM</p>
        {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% if mensajes %}
        {% for cat, msg in mensajes %}
        <div class="alerta alerta-{{ cat }}">{{ msg }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        <form method="POST">
            <label>Usuario</label>
            <input type="text" name="usuario" required placeholder="Ej: admin_daem">
            <label>Clave</label>
            <input type="password" name="clave" required placeholder="Tu contraseña">
            <button type="submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
