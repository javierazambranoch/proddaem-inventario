{% extends "base.html" %}
{% block titulo %}ProDaem - Mi Perfil{% endblock %}
{% block contenido %}
<h1>Mi Perfil</h1>
<p style="color:#666; margin-bottom:20px;">Consulta y edita tus datos personales.</p>

<div class="perfil-info">
    <p><strong>Usuario:</strong> {{ perfil.usuario }}</p>
    <p><strong>Establecimiento:</strong> {{ perfil.establecimiento }}</p>
</div>

<h2 style="margin-top:24px; color:#1565c0;">Datos personales</h2>
<form method="POST" class="formulario">
    <div class="campo">
        <label>Nombre completo *</label>
        <input type="text" name="nombre_completo" required value="{{ perfil.nombre_completo or '' }}" placeholder="Tu nombre completo">
    </div>
    <div class="campo">
        <label>Celular</label>
        <input type="text" name="celular" value="{{ perfil.celular or '' }}" placeholder="Ej: +56912345678">
    </div>
    <div class="campo">
        <label>Correo</label>
        <input type="text" name="correo" value="{{ perfil.correo or '' }}" placeholder="Ej: correo@escuela.cl">
    </div>
    <div class="campo" style="grid-column: 1 / -1;">
        <label>Dirección</label>
        <input type="text" name="direccion" value="{{ perfil.direccion or '' }}" placeholder="Dirección">
    </div>
    <div class="campo" style="grid-column: 1 / -1;">
        <label>Nueva clave</label>
        <input type="password" name="clavenueva" placeholder="Dejar vacío si no deseas cambiar la clave">
    </div>
    <button type="submit" class="btn-guardar">Guardar Perfil</button>
</form>
{% endblock %}
