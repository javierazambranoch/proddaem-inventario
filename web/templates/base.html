<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}ProDaem{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>ProDaem</h2>
            <p>{{ usuario }}</p>
        </div>
        <nav>
            <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}activo{% endif %}">Inicio</a>
            <a href="{{ url_for('inventario') }}" class="{% if request.endpoint == 'inventario' %}activo{% endif %}">Inventario</a>
            <a href="{{ url_for('solicitudes') }}" class="{% if request.endpoint == 'solicitudes' %}activo{% endif %}">Solicitudes</a>
            <a href="{{ url_for('historial') }}" class="{% if request.endpoint == 'historial' %}activo{% endif %}">Historial</a>
        </nav>
        <a href="{{ url_for('logout') }}" class="btn-salir">Cerrar sesión</a>
    </div>
    <div class="contenido">
        {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% if mensajes %}
        <div class="mensajes">
            {% for cat, msg in mensajes %}
            <div class="alerta alerta-{{ cat }}">{{ msg }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        {% block contenido %}{% endblock %}
    </div>
</body>
</html>
